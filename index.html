        function renderSmartSuggestions() {
            const grid = document.getElementById('smart-actions-grid');
            if (!grid) return;

            if (!showSmartSuggestions) {
                grid.classList.add('hidden');
                return;
            } else {
                grid.classList.remove('hidden');
            }

            grid.innerHTML = '';
            const suggestions = [];

            const lhs = state.lhs;
            const rhs = state.rhs;

            if (lhs.coeff.d > 1 || lhs.constVal.d > 1 || rhs.coeff.d > 1 || rhs.constVal.d > 1) {
                const lcm = (a, b) => (a * b) / ((gcd = (x, y) => y === 0 ? x : gcd(y, x % y))(a, b));
                let denomLCM = lcm(lcm(lhs.coeff.d, lhs.constVal.d), lcm(rhs.coeff.d, rhs.constVal.d));
                if (denomLCM > 1) {
                    suggestions.push({
                        label: `兩邊 × ${denomLCM} (消分母)`,
                        op: '*', val: `${denomLCM}`
                    });
                }
            }

            if (!rhs.coeff.isZero()) {
                if (rhs.coeff.isNegative()) {
                    let positiveCoeff = rhs.coeff.negate();
                    suggestions.push({
                        label: `兩邊 + ${new LinearExpr(positiveCoeff, 0).toString()} (消右未知數)`,
                        op: '+', val: new LinearExpr(positiveCoeff, 0).toString()
                    });
                } else {
                    suggestions.push({
                        label: `兩邊 - ${rhs.coeff.d === 1 ? (rhs.coeff.n === 1 ? 'x' : `${rhs.coeff.n}x`) : `${rhs.coeff.n}x/${rhs.coeff.d}`} (消右未知數)`,
                        op: '-', val: rhs.coeff.d === 1 ? (rhs.coeff.n === 1 ? 'x' : `${rhs.coeff.n}x`) : `${rhs.coeff.n}x/${rhs.coeff.d}`
                    });
                }
            }

            if (!lhs.constVal.isZero()) {
                if (lhs.constVal.isNegative()) {
                    let absConst = lhs.constVal.negate();
                    suggestions.push({
                        label: `兩邊 + ${absConst.toString()} (消左常數)`,
                        op: '+', val: absConst.toString()
                    });
                } else {
                    suggestions.push({
                        label: `兩邊 - ${lhs.constVal.toString()} (消左常數)`,
                        op: '-', val: lhs.constVal.toString()
                    });
                }
            }

            if (rhs.coeff.isZero() && !lhs.coeff.isZero() && !lhs.coeff.isOne()) {
                if (lhs.coeff.d === 1) {
                    suggestions.push({
                        label: `兩邊 ÷ ${lhs.coeff.toString()} (化簡 x 係數)`,
                        op: '/', val: lhs.coeff.toString()
                    });
                } else {
                    suggestions.push({
                        label: `兩邊 × ${lhs.coeff.d} (消分母)`,
                        op: '*', val: `${lhs.coeff.d}`
                    });
                }
            }

            if (suggestions.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center text-xs text-slate-400 py-2">已是化簡狀態或可直接觀察得出解答！</div>`;
                return;
            }

            suggestions.forEach(s => {
                const btn = document.createElement('button');
                btn.className = `p-1.5 text-[11px] font-bold rounded-xl border transition flex items-center justify-between ${
                    allowSmartSuggestionClick
                        ? 'bg-indigo-950/60 border-indigo-500/40 text-indigo-200 hover:bg-indigo-600 hover:text-white'
                        : 'bg-slate-900 border-slate-800 text-slate-500 cursor-not-allowed'
                }`;
                btn.innerHTML = `<span class="truncate"><i class="fa-solid fa-wand-magic-sparkles mr-1 text-amber-400"></i>${s.label}</span> <i class="fa-solid fa-chevron-right text-[9px] ml-1"></i>`;
                btn.onclick = () => {
                    if (!allowSmartSuggestionClick) {
                        showToast("請於指令列或計算盤輸入算式解題！");
                        return;
                    }
                    executeOp(s.op, s.val);
                };
                grid.appendChild(btn);
            });
        }

        function toggleSmartSuggestions() {
            showSmartSuggestions = !showSmartSuggestions;
            const textEl = document.getElementById('text-toggle-smart');
            const iconEl = document.getElementById('icon-toggle-smart');

            if (showSmartSuggestions) {
                textEl.innerText = "隱藏";
                iconEl.className = "fa-solid fa-eye-slash";
            } else {
                textEl.innerText = "顯示";
                iconEl.className = "fa-solid fa-eye";
            }
            renderSmartSuggestions();
        }

        function getTargetInput() {
            if (document.activeElement && document.activeElement.tagName === 'INPUT' && document.body.contains(document.activeElement)) {
                return document.activeElement;
            }
            if (lastFocusedInput && document.body.contains(lastFocusedInput) && lastFocusedInput.tagName === 'INPUT') {
                return lastFocusedInput;
            }
            if (state.pendingStep && state.pendingStep.active) {
                const stepIdx = state.history.length - 1;
                if (!state.pendingStep.lhsDone) {
                    const lhsInput = document.getElementById(`manual-lhs-input-${stepIdx}`);
                    if (lhsInput) return lhsInput;
                }
                if (!state.pendingStep.rhsDone) {
                    const rhsInput = document.getElementById(`manual-rhs-input-${stepIdx}`);
                    if (rhsInput) return rhsInput;
                }
            }
            return document.getElementById('quick-cmd-input');
        }

        function appendCalcInput(char) {
            const inputEl = getTargetInput();
            if (!inputEl) return;
            
            const start = inputEl.selectionStart;
            const end = inputEl.selectionEnd;
            if (typeof start === 'number' && typeof end === 'number') {
                const val = inputEl.value;
                inputEl.value = val.substring(0, start) + char + val.substring(end);
                inputEl.selectionStart = inputEl.selectionEnd = start + char.length;
            } else {
                inputEl.value += char;
            }
            inputEl.focus();
        }

        function clearCalcInput() {
            const inputEl = getTargetInput();
            if (!inputEl) return;
            inputEl.value = '';
            inputEl.focus();
        }

        function backspaceCalcInput() {
            const inputEl = getTargetInput();
            if (!inputEl) return;
            
            const start = inputEl.selectionStart;
            const end = inputEl.selectionEnd;
            if (typeof start === 'number' && typeof end === 'number') {
                const val = inputEl.value;
                if (start === end) {
                    if (start > 0) {
                        inputEl.value = val.substring(0, start - 1) + val.substring(start);
                        inputEl.selectionStart = inputEl.selectionEnd = start - 1;
                    }
                } else {
                    inputEl.value = val.substring(0, start) + val.substring(end);
                    inputEl.selectionStart = inputEl.selectionEnd = start;
                }
            } else {
                inputEl.value = inputEl.value.slice(0, -1);
            }
            inputEl.focus();
        }

        function handleKeypadSubmit(e) {
            if (e && e.preventDefault) e.preventDefault();
            const targetInput = getTargetInput();
            if (!targetInput) return;

            if (targetInput.id.startsWith('manual-lhs-input-')) {
                const stepIdx = parseInt(targetInput.id.replace('manual-lhs-input-', ''), 10);
                submitManualSimplify(e, 'lhs', stepIdx);
                return;
            }
            if (targetInput.id.startsWith('manual-rhs-input-')) {
                const stepIdx = parseInt(targetInput.id.replace('manual-rhs-input-', ''), 10);
                submitManualSimplify(e, 'rhs', stepIdx);
                return;
            }

            handleQuickCommandSubmit(e);
        }

        function handleQuickCommandSubmit(e) {
            if (e && e.preventDefault) e.preventDefault();
            const inputEl = document.getElementById('quick-cmd-input');
            if (!inputEl) return;
            let val = inputEl.value.trim();
            if (!val) return;

            if (val === '展開' || val === '化簡') {
                executeOp('展開', '展開');
                inputEl.value = '';
                return;
            }

            let op = null;
            let valStr = '';

            val = val.replace(/加/g, '+')
                     .replace(/減/g, '-')
                     .replace(/乘/g, '*')
                     .replace(/除/g, '/')
                     .replace(/÷/g, '/')
                     .replace(/×/g, '*');

            if (val.startsWith('+')) {
                op = '+';
                valStr = val.substring(1);
            } else if (val.startsWith('-')) {
                op = '-';
                valStr = val.substring(1);
            } else if (val.startsWith('*')) {
                op = '*';
                valStr = val.substring(1);
            } else if (val.startsWith('/')) {
                op = '/';
                valStr = val.substring(1);
            } else {
                showToast("請包含運算符號（例如：+4, -4, ×2, ÷3, 或 展開）");
                return;
            }

            if (!valStr.trim() && op !== '展開') {
                showToast("請輸入完整的運算內容！");
                return;
            }

            executeOp(op, valStr.trim());
            inputEl.value = '';
        }

        /**
         * Opens Custom Modal and automatically triggers iOS Native Keyboard
         */
        function openCustomModal() {
            const modal = document.getElementById('custom-modal');
            if (modal) modal.classList.remove('hidden');
            const input = document.getElementById('custom-equation-input');
            if (input) {
                setTimeout(() => {
                    input.focus();
                    lastFocusedInput = input;
                }, 100);
            }
        }

        function closeCustomModal() {
            const modal = document.getElementById('custom-modal');
            if (modal) modal.classList.add('hidden');
            const errEl = document.getElementById('custom-modal-error');
            if (errEl) errEl.classList.add('hidden');
        }

        function handleCustomEquationSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('custom-equation-input');
            const errEl = document.getElementById('custom-modal-error');
            if (!input) return;

            const eqStr = input.value.trim();
            if (!eqStr.includes('=')) {
                if (errEl) {
                    errEl.innerText = "方程式必須包含等號 '='！";
                    errEl.classList.remove('hidden');
                }
                return;
            }

            const parts = eqStr.split('=');
            if (parts.length !== 2) {
                if (errEl) {
                    errEl.innerText = "方程式只能有一個等號 '='！";
                    errEl.classList.remove('hidden');
                }
                return;
            }

            try {
                setupEquation(parts[0], parts[1]);
                state.level = 'custom';
                const levelBadge = document.getElementById('level-badge');
                if (levelBadge) levelBadge.innerText = '自訂方程式';

                ['1', '2', '3', '4', '5', 'random', 'custom'].forEach(b => {
                    const btn = document.getElementById(`btn-lvl-${b}`);
                    if (btn) {
                        if (b === 'custom') btn.classList.add('lvl-btn-active');
                        else btn.classList.remove('lvl-btn-active');
                    }
                });

                closeCustomModal();
                input.value = '';
            } catch (err) {
                if (errEl) {
                    errEl.innerText = `解析失敗：${err.message}`;
                    errEl.classList.remove('hidden');
                }
            }
        }

        function undoStep() {
            if (state.history.length === 0) {
                showToast("已退回至最初步驟！");
                return;
            }
            state.history.pop();
            if (state.history.length === 0) {
                state.lhs = state.initialLHS.clone();
                state.rhs = state.initialRHS.clone();
            } else {
                const lastStep = state.history[state.history.length - 1];
                state.lhs = lastStep.lhs.clone();
                state.rhs = lastStep.rhs.clone();
            }
            state.solved = false;
            state.pendingStep = null;
            renderCurrentState();
            showToast("已復原上一步");
        }

        function resetEquation() {
            if (!state.initialLHS || !state.initialRHS) return;
            state.lhs = state.initialLHS.clone();
            state.rhs = state.initialRHS.clone();
            state.history = [];
            state.solved = false;
            state.pendingStep = null;
            renderCurrentState();
            showToast("已重新開始此題");
        }

        function nextProblem() {
            setLevel(state.level);
        }

        function showHint() {
            const lhs = state.lhs;
            const rhs = state.rhs;

            if (state.solved) {
                showToast("方程式已解出，無須提示！");
                return;
            }

            if (!rhs.coeff.isZero()) {
                showToast(`建議提示：先消去右邊的未知數項 ${rhs.coeff.d === 1 ? (rhs.coeff.n === 1 ? 'x' : rhs.coeff.n + 'x') : rhs.coeff.toLaTeX() + 'x'}`);
            } else if (!lhs.constVal.isZero()) {
                showToast(`建議提示：兩邊同加減常數，消去左邊的常數項 ${lhs.constVal.toString()}`);
            } else if (!lhs.coeff.isOne() && !lhs.coeff.isZero()) {
                showToast(`建議提示：兩邊同除以 x 的係數 ${lhs.coeff.toString()}`);
            } else {
                showToast("當前已是非常簡潔的型態，觀察等式兩邊即可完成！");
            }
        }

        function checkSolvedCondition() {
            const lhs = state.lhs;
            const rhs = state.rhs;

            if ((lhs.coeff.isOne() && lhs.constVal.isZero() && rhs.coeff.isZero()) ||
                (rhs.coeff.isOne() && rhs.constVal.isZero() && lhs.coeff.isZero())) {
                if (!state.solved) {
                    state.solved = true;
                    onProblemSolved(); // Trigger stats & medals check
                    renderCurrentState();
                    setTimeout(() => {
                        triggerConfetti();
                    }, 100);
                }
            }
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas || !canvas.parentElement) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;

            const particles = [];
            const colors = ['#818cf8', '#34d399', '#f472b6', '#fbbf24', '#60a5fa'];

            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 3,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.6) * 10,
                    size: Math.random() * 5 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.015
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.alpha > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.22;
                        p.alpha -= p.decay;

                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });

                if (alive) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }

        window.onload = function() {
            loadStats();
            updateManualToggleUI();
            setLevel('1');
        };
    </script>
</body>
</html>
